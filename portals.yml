# career-ops Portal Configuration
# Customized for Jens Fursund -- CG x AI leadership roles
# Copenhagen / EU / Remote focus

# Title filters applied across all portals
title_filter:
  positive:
    - "CTO"
    - "Chief Technology"
    - "VP Engineering"
    - "VP of Engineering"
    - "Director of Engineering"
    - "Head of Engineering"
    - "Head of AI"
    - "Head of ML"
    - "Principal Engineer"
    - "Staff Engineer"
    - "Graphics Engineer"
    - "Rendering Engineer"
    - "3D Engineer"
    - "Computer Vision"
    - "AI Engineer"
    - "ML Engineer"
    - "XR Engineer"
    - "AR/VR"
    - "Technical Lead"
    - "Engineering Manager"
    - "Platform Lead"
  negative:
    - "Intern"
    - "Junior"
    - "Associate"
    - "Entry Level"
    - "Sales"
    - "Marketing"
    - "HR"
    - "Recruiter"

