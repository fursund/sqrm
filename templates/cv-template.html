<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{NAME}} - CV</title>
<style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('../fonts/space-grotesk-latin.woff2') format('woff2');
    font-weight: 300 700;
    font-display: swap;
  }
  @font-face {
    font-family: 'Space Grotesk';
    src: url('../fonts/space-grotesk-latin-ext.woff2') format('woff2');
    font-weight: 300 700;
    font-display: swap;
    unicode-range: U+0100-024F;
  }
  @font-face {
    font-family: 'DM Sans';
    src: url('../fonts/dm-sans-latin.woff2') format('woff2');
    font-weight: 300 700;
    font-display: swap;
  }
  @font-face {
    font-family: 'DM Sans';
    src: url('../fonts/dm-sans-latin-ext.woff2') format('woff2');
    font-weight: 300 700;
    font-display: swap;
    unicode-range: U+0100-024F;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 10pt;
    line-height: 1.5;
    color: #1a1a1a;
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }

  .page {
    max-width: 8.5in;
    margin: 0 auto;
    padding: 0.4in 0;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 0.15in;
  }

  .header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22pt;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 4px;
  }

  .header .contact {
    font-size: 9pt;
    color: #555;
  }

  .header .contact a {
    color: hsl(187, 74%, 32%);
    text-decoration: none;
  }

  .gradient-line {
    height: 2px;
    background: linear-gradient(90deg, hsl(187, 74%, 32%), hsl(270, 70%, 45%));
    margin: 8px 0 16px 0;
  }

  /* Sections */
  .section {
    margin-bottom: 14px;
    break-inside: avoid;
    page-break-inside: avoid;
  }

  .section-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: hsl(187, 74%, 32%);
    border-bottom: 1px solid #ddd;
    padding-bottom: 3px;
    margin-bottom: 8px;
  }

  /* Summary */
  .summary {
    font-size: 10pt;
    color: #333;
    line-height: 1.6;
  }

  /* Competencies */
  .competencies {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }

  .competency-tag {
    background: hsl(187, 74%, 95%);
    color: hsl(187, 74%, 25%);
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 8.5pt;
    font-weight: 500;
  }

  /* Experience */
  .experience-item {
    margin-bottom: 10px;
    break-inside: avoid;
    page-break-inside: avoid;
  }

  .experience-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 2px;
  }

  .experience-header .role {
    font-weight: 700;
    font-size: 10.5pt;
  }

  .experience-header .dates {
    font-size: 9pt;
    color: #666;
    white-space: nowrap;
  }

  .experience-header .company {
    color: hsl(270, 70%, 45%);
    font-weight: 600;
  }

  .experience-bullets {
    list-style: none;
    padding-left: 0;
  }

  .experience-bullets li {
    position: relative;
    padding-left: 12px;
    margin-bottom: 2px;
    font-size: 9.5pt;
    color: #333;
  }

  .experience-bullets li::before {
    content: "\2022";
    position: absolute;
    left: 0;
    color: hsl(187, 74%, 32%);
    font-weight: bold;
  }

  /* Education */
  .education-item {
    margin-bottom: 6px;
  }

  .education-item .degree {
    font-weight: 700;
    font-size: 10pt;
  }

  .education-item .school {
    color: #555;
    font-size: 9.5pt;
  }

  /* Skills */
  .skills-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 16px;
    font-size: 9.5pt;
  }

  .skills-grid .skill-category {
    font-weight: 600;
    color: hsl(187, 74%, 32%);
  }

  /* Print */
  @media print {
    body { font-size: 10pt; }
    .page { padding: 0; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <h1>{{NAME}}</h1>
    <div class="contact">
      {{EMAIL}} | {{PHONE}} | <a href="https://{{LINKEDIN}}">LinkedIn</a> | <a href="https://{{GITHUB}}">GitHub</a>
    </div>
    <div class="gradient-line"></div>
  </div>

  <div class="section">
    <div class="section-title">Summary</div>
    <div class="summary">{{SECTION_SUMMARY}}</div>
  </div>

  <div class="section">
    <div class="section-title">Core Competencies</div>
    <div class="competencies">{{SECTION_COMPETENCIES}}</div>
  </div>

  <div class="section">
    <div class="section-title">Experience</div>
    {{SECTION_EXPERIENCE}}
  </div>

  <div class="section">
    <div class="section-title">Education</div>
    {{SECTION_EDUCATION}}
  </div>

  <div class="section">
    <div class="section-title">Projects</div>
    {{SECTION_PROJECTS}}
  </div>

  <div class="section">
    <div class="section-title">Skills</div>
    <div class="skills-grid">{{SECTION_SKILLS}}</div>
  </div>

</div>
</body>
</html>
